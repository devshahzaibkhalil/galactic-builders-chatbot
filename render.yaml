services:
  - type: web
    name: galactic-builders-chatbot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "gunicorn -c gunicorn.conf.py wsgi:app"
    envVars:
      - key: FLASK_ENV
        value: production
      # Paste the existing database's Internal Connection String here
      # manually in the Render dashboard (Environment tab) — this app
      # shares the database used by your other chatbot.
      - key: DATABASE_URL
        sync: false
      # Isolates this app's tables from your other chatbot's tables in the
      # same shared database. Must match on every deploy — don't change
      # this value later without a migration plan.
      - key: DB_SCHEMA
        value: "galactic_builders"
      # Generate real values for the four secrets below locally and paste
      # them in the Render dashboard (Environment tab) — do NOT put real
      # secrets in this file if it's committed to a public repo.
      - key: SECRET_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: BLIND_INDEX_KEY
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://galacticbuilldersllc.com,https://www.galacticbuilldersllc.com"
      - key: ALLOWED_FRAME_ANCESTORS
        value: "https://galacticbuilldersllc.com,https://www.galacticbuilldersllc.com"
      # Email — fill in with your real SMTP provider before going live;
      # lead notifications silently no-op
