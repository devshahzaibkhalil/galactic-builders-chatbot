services:
  - type: web
    name: galactic-builders-chatbot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "gunicorn -c gunicorn.conf.py wsgi:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: BLIND_INDEX_KEY
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://galacticbuilldersllc.com,https://www.galacticbuilldersllc.com"
      - key: ALLOWED_FRAME_ANCESTORS
        value: "https://galacticbuilldersllc.com,https://www.galacticbuilldersllc.com"
      - key: EMAIL_PROVIDER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: LEAD_NOTIFICATION_EMAIL
        sync: false
