<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dashboard{% endblock %} — Galactic Project Concierge</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/css/admin.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 20L12 4L21 20" stroke="#0d2238" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 20V13H17V20" stroke="#0d2238" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="sidebar-brand-text">
          <div class="eyebrow">Galactic Builders</div>
          <div class="title">Project Concierge</div>
        </div>
      </div>

      <nav class="nav-group">
        <a class="nav-link {% if active_page == 'leads' %}active{% endif %}" href="/admin/dashboard/leads">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
          Leads
        </a>
        <a class="nav-link {% if active_page == 'settings' %}active{% endif %}" href="/admin/dashboard/settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          Settings
        </a>
      </nav>

      <button class="bell-btn" type="button" id="bell-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        Notifications
        <span class="bell-badge" id="bell-badge" hidden>0</span>
      </button>
      <div class="bell-dropdown" id="bell-dropdown" hidden></div>

      <div class="sidebar-footer">
        <div class="sidebar-user" id="sidebar-user">
          <strong>&nbsp;</strong>
          &nbsp;
        </div>
        <button class="btn-logout" data-action="logout" type="button">Sign out</button>
      </div>
    </aside>

    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="{{ url_for('static', filename='admin/js/admin.js') }}"></script>
  <script>
    applyStoredTheme();

    (async () => {
      const user = await requireLogin();
      if (!user) return;
      const el = document.getElementById("sidebar-user");
      if (el) {
        el.innerHTML = `<strong>${escapeHtml(user.username)}</strong>${escapeHtml(user.role)}`;
      }
      initNotificationBell();
    })();
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
