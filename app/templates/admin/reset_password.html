<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Galactic Project Concierge</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/css/admin.css') }}">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 20L12 4L21 20" stroke="#f1d58b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 20V13H17V20" stroke="#f1d58b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="login-brand-text">
          <div class="eyebrow">Galactic Builders</div>
          <div class="title">Set a new password</div>
        </div>
      </div>

      <div id="form-error" class="form-error" hidden></div>
      <div id="form-success" class="form-error" hidden style="background:#e6f7ec;color:#1a7f37;"></div>

      <form id="reset-form">
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="confirm">Confirm new password</label>
          <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">Update password</button>
      </form>

      <p class="form-hint"><a href="/admin/dashboard/login">Back to sign in</a></p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='admin/js/admin.js') }}"></script>
  <script>
    const form = document.getElementById("reset-form");
    const errorBox = document.getElementById("form-error");
    const successBox = document.getElementById("form-success");
    const token = new URLSearchParams(window.location.search).get("token");

    if (!token) {
      errorBox.textContent = "This reset link is missing its token. Please request a new one.";
      errorBox.hidden = false;
      form.hidden = true;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.hidden = true;
      successBox.hidden = true;

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password !== confirm) {
        errorBox.textContent = "Passwords do not match.";
        errorBox.hidden = false;
        return;
      }

      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;

      try {
        const result = await AdminAPI.post("/admin/reset-password", { token, password });
        successBox.textContent = result.message || "Password updated. You can now sign in.";
        successBox.hidden = false;
        form.hidden = true;
      } catch (err) {
        errorBox.textContent = (err.data && err.data.message) || "That reset link is invalid or expired.";
        errorBox.hidden = false;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
