<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — Galactic Project Concierge</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/css/admin.css') }}">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 20L12 4L21 20" stroke="#f1d58b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 20V13H17V20" stroke="#f1d58b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="login-brand-text">
          <div class="eyebrow">Galactic Builders</div>
          <div class="title">Reset your password</div>
        </div>
      </div>

      <div id="form-error" class="form-error" hidden></div>
      <div id="form-success" class="form-error" hidden style="background:#e6f7ec;color:#1a7f37;"></div>

      <form id="forgot-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">Send reset link</button>
      </form>

      <p class="form-hint"><a href="/admin/dashboard/login">Back to sign in</a></p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='admin/js/admin.js') }}"></script>
  <script>
    const form = document.getElementById("forgot-form");
    const errorBox = document.getElementById("form-error");
    const successBox = document.getElementById("form-success");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.hidden = true;
      successBox.hidden = true;
      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;

      const email = document.getElementById("email").value.trim();

      try {
        const result = await AdminAPI.post("/admin/forgot-password", { email });
        successBox.textContent = result.message || "If that email matches an account, a reset link has been sent.";
        successBox.hidden = false;
        form.hidden = true;
      } catch (err) {
        errorBox.textContent = "Something went wrong. Please try again.";
        errorBox.hidden = false;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
